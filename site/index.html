        attempt = {schema: 1, id, started: Date.now(), release: build.release, pack_bytes: build.pack_bytes,
            render_720p: fixed720, house_simple: simpleHouse, detailed: enabled, title_reached: false, last_stage: phase, samples: []};
        if (enabled) {
            hud = document.createElement("pre");
            hud.id = "catiators-diagnostics-hud";
            hud.style.cssText = "position:fixed;left:0;top:0;z-index:10;width:100%;box-sizing:border-box;overflow:auto;white-space:pre-wrap;background:#111;color:#fff;margin:0;padding:8px;font:14px/18px monospace;touch-action:pan-y;";
            document.body.appendChild(hud);
        }
        window.addEventListener("error", () => stage("javascript_error"));
        window.addEventListener("unhandledrejection", () => stage("unhandled_rejection"));
        const canvas = document.getElementById("canvas");
        if (canvas) canvas.addEventListener("webglcontextlost", () => stage("webgl_context_lost"));
        window.addEventListener("pagehide", () => stage("page_left"));
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "hidden") stage("page_hidden");
        });
        record();
    }
    window.catiatorsRequestFullscreen = () => {
        if (!document.fullscreenEnabled || !document.documentElement.requestFullscreen) return;
        const id = "catiators-fullscreen-help";
        const clear = () => document.getElementById(id)?.remove();
        const rejected = () => {
            clear();
            const help = document.createElement("button");
            help.id = id;
            help.textContent = "Browser needs a click or tap for full screen. Click here to try again.";
            help.style.cssText = "position:fixed;bottom:12px;left:5%;width:90%;z-index:20;padding:12px;color:#fff1cf;background:#30204f;font:18px sans-serif;";
            help.onclick = () => window.catiatorsRequestFullscreen();
            document.body.appendChild(help);
            setTimeout(() => help.remove(), 10000);
        };
        try {
            Promise.resolve(document.documentElement.requestFullscreen()).then(clear, rejected);
        } catch (_) { rejected(); }
    };
    const loader = document.createElement("script");
    loader.src = document.getElementById("catiators-engine").getAttribute("data-engine-src");
    loader.onload = () => {
        stage("loader_ready");
        const startup = document.createElement("script");
        startup.textContent = document.getElementById("catiators-startup").textContent;
        document.body.appendChild(startup);
    };
    loader.onerror = () => stage("loader_failed");
    stage("loader_requested");
    document.body.appendChild(loader);
})();

</script>
	</body>
</html>
