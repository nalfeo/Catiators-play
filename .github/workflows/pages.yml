name: Publish playtest

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify game artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check the published files against the checked export
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          site = Path('site')
          manifest = json.loads((site / 'web-export.json').read_text())
          expected = {'index.html', 'index.js', 'index.wasm', 'index.pck', 'index.png',
                      'index.audio.worklet.js', 'index.audio.position.worklet.js'}
          assert set(manifest['files']) == expected
          assert manifest['thread_support'] is False and manifest['mode'] == 'release'
          # GitHub rejects Git blobs over 100 MiB. Rebuild a large pack from
          # exactly two bounded parts, then verify the original artifact hash.
          pack = site / 'index.pck'
          parts = [site / 'index.pck.part0', site / 'index.pck.part1']
          if not pack.exists():
              assert all(part.is_file() and not part.is_symlink() for part in parts)
              with pack.open('wb') as output:
                  for part in parts:
                      with part.open('rb') as source:
                          while chunk := source.read(1024 * 1024):
                              output.write(chunk)
          else:
              assert not any(part.exists() for part in parts)
          for name, record in manifest['files'].items():
              path = site / name
              assert path.is_file() and not path.is_symlink(), name
              payload = path.read_bytes()
              assert len(payload) == record['bytes'] > 0, name
              assert hashlib.sha256(payload).hexdigest() == record['sha256'], name
          for part in parts:
              part.unlink(missing_ok=True)
          print('Checked export hashes match all seven game files.')
          PY
      - name: Upload only the checked game
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
